<svg xmlns="http://www.w3.org/2000/svg" width="54mm" height="86mm" viewBox="0 0 54 86">
<title>Card design: indigo band with kanji, name below</title>
<rect width="54" height="86" fill="#f7f4ec"/>
<rect x="1" y="1" width="52" height="84" fill="none" stroke="#ddd6c6" stroke-width=".6"/>
<rect width="54" height="22" fill="#22304a"/>
<rect y="22" width="54" height="1" fill="#a13d36"/>
<text x="5" y="15" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="8" fill="#f2eee4">名刺</text>
<text x="27" y="48" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-size="4.4" font-weight="700" letter-spacing="1" fill="#22304a" text-anchor="middle">YOUR NAME</text>
<text x="27" y="54.5" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-size="3" fill="#22304a" opacity=".75" text-anchor="middle">your shop · your town</text>
<text x="27" y="77" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-size="2.7" fill="#22304a" opacity=".55" text-anchor="middle">tap me</text>
