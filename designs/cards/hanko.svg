<svg xmlns="http://www.w3.org/2000/svg" width="54mm" height="86mm" viewBox="0 0 54 86">
<title>Card design: red hanko seal over the name</title>
<rect width="54" height="86" fill="#f7f4ec"/>
<rect x="1" y="1" width="52" height="84" fill="none" stroke="#ddd6c6" stroke-width=".6"/>
<rect x="20" y="17" width="14" height="14" rx="1.4" fill="#a13d36"/>
<text x="27" y="28" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="10" fill="#f2eee4" text-anchor="middle">名</text>
<text x="27" y="47" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-size="4.4" font-weight="700" letter-spacing="1" fill="#22304a" text-anchor="middle">YOUR NAME</text>
<rect x="21.5" y="51.5" width="11" height=".5" fill="#22304a" opacity=".35"/>
<text x="27" y="58" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-size="3" fill="#22304a" opacity=".75" text-anchor="middle">your shop</text>
<text x="27" y="76" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-size="2.7" fill="#22304a" opacity=".55" text-anchor="middle">(647) 000-0000</text>
