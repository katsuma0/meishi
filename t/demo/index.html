:root {
  color-scheme: light;
  --indigo: #22304a;
  --cotton: #f2eee4;
  --selvedge: #a13d36;
  --display: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--cotton); }
body { text-transform: lowercase;
  margin: 0;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2rem;
  padding: 2.5rem 1.25rem;
  font-family: var(--display);
  color: var(--indigo);
  background: var(--cotton);
}
.logo {
  text-decoration: none;
  color: var(--indigo);
  text-align: center;
  display: grid;
  gap: .125rem;
}
.logo-kanji {
  font-family: "Yuji Syuku", "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-weight: 400;
  font-size: 3.6rem;
  line-height: 1;
  letter-spacing: .04em;
}
.logo-name {
  font-family: var(--display);
  font-size: .875rem;
  letter-spacing: .12em;
}
.links {
  width: min(22rem, 100%);
  display: grid;
  gap: .75rem;
  margin: 0;
}
.links a {
  display: block;
  background: var(--indigo);
  color: var(--cotton);
  text-align: center;
  text-decoration: none;
  font-weight: 600;
  font-size: 1.0625rem;
  padding: 1rem;
  transition: transform .12s cubic-bezier(.2, .7, .3, 1), background-color .15s ease;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.links a:hover { background: var(--selvedge); }
.links a:active { transform: scale(.97); }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
